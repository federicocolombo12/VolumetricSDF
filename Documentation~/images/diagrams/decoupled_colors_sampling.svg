<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .diagram-bg { fill: url(#bgGrad); stroke: #30363d; stroke-width: 1.5; rx: 12px; }
    .card-panel { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
    .inner-panel { fill: #0d1117; stroke: #21262d; stroke-width: 1; rx: 6px; }
    .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 600; fill: #f0f6fc; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; line-height: 1.4; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #58a6ff; }
  </style>

  <!-- Background -->
  <rect width="920" height="360" class="diagram-bg" />

  <!-- Header -->
  <g transform="translate(32, 34)">
    <text x="0" y="0" class="kicker" fill="#c084fc">GPU TEXTURE SAMPLING &amp; PARTICLE ADVECTION</text>
    <text x="0" y="22" class="title" style="font-size: 18px; font-weight: 700;">Decoupled 3D Texture Evaluation in Unity VFX Graph</text>
  </g>

  <!-- STAGE 1: PARTICLE (X: 32, W: 180) -->
  <g transform="translate(32, 86)">
    <rect width="180" height="236" class="card-panel" />
    <rect x="0" y="0" width="4" height="236" fill="#38bdf8" rx="2" />

    <text x="16" y="24" class="kicker" fill="#38bdf8">STEP 01 • VFX GRAPH</text>
    <text x="16" y="44" class="title">Particle Position</text>
    <text x="16" y="62" class="sub">Per-particle thread query</text>

    <g transform="translate(12, 78)">
      <rect width="156" height="142" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 11.5px; fill: #38bdf8;">PositionWS</text>
      <text x="12" y="38" class="code">float3 position</text>
      <text x="12" y="58" class="sub">World space coord</text>
      <text x="12" y="76" class="sub">Over 250k live particles</text>
      <text x="12" y="94" class="sub">advecting freely in XR</text>
      <text x="12" y="120" class="code" style="fill:#34d399;">Direct GPU register</text>
    </g>
  </g>

  <!-- STAGE 2: COORDINATE TRANSFORM (X: 236, W: 200) -->
  <g transform="translate(236, 86)">
    <rect width="200" height="236" class="card-panel" />
    <rect x="0" y="0" width="4" height="236" fill="#f59e0b" rx="2" />

    <text x="16" y="24" class="kicker" fill="#f59e0b">STEP 02 • MATRIX</text>
    <text x="16" y="44" class="title">TRS Normalization</text>
    <text x="16" y="62" class="sub">Inverse volume bounds</text>

    <g transform="translate(12, 78)">
      <rect width="176" height="142" class="inner-panel" stroke="#f59e0b" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 11.5px; fill: #f59e0b;">World ➔ UVW</text>
      <text x="12" y="40" class="code">_WorldToVolumeMatrix</text>
      <text x="12" y="60" class="sub">P_local = M_inv * P_ws</text>
      <text x="12" y="80" class="code" style="fill:#fbbf24;">UVW = (P_local / size)</text>
      <text x="12" y="96" class="code" style="fill:#fbbf24;">      + 0.5</text>
      <text x="12" y="120" class="sub" style="font-size:9.5px; fill:#34d399;">Normalized range [0, 1]³</text>
    </g>
  </g>

  <!-- STAGE 3: 3D TEXTURE SAMPLE (X: 460, W: 200) -->
  <g transform="translate(460, 86)">
    <rect width="200" height="236" class="card-panel" stroke="#c084fc" stroke-dasharray="4 2" />
    <rect x="0" y="0" width="4" height="236" fill="#c084fc" rx="2" />

    <text x="16" y="24" class="kicker" fill="#c084fc">STEP 03 • SAMPLING</text>
    <text x="16" y="44" class="title">Sample Texture3D</text>
    <text x="16" y="62" class="sub">Single hardware fetch</text>

    <g transform="translate(12, 78)">
      <rect width="176" height="142" class="inner-panel" stroke="#c084fc" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 11.5px; fill: #c084fc;">128³ 3D Texture</text>
      <text x="12" y="38" class="code">RGBAHalf / RGBAFloat</text>
      <text x="12" y="58" class="sub">Hardware tri-linear</text>
      <text x="12" y="74" class="sub">interpolation across</text>
      <text x="12" y="90" class="sub">neighboring 8 voxels</text>
      <text x="12" y="120" class="code" style="fill:#38bdf8;">1 Fetch = Distance + RGB</text>
    </g>
  </g>

  <!-- STAGE 4: FORKED OUTPUTS (X: 684, W: 204) -->
  <g transform="translate(684, 86)">
    <rect width="204" height="236" class="card-panel" />
    <rect x="0" y="0" width="4" height="236" fill="#34d399" rx="2" />

    <text x="16" y="24" class="kicker" fill="#34d399">STEP 04 • CHANNELS</text>
    <text x="16" y="44" class="title">Dual Output Physics</text>
    <text x="16" y="62" class="sub">Independent behavior</text>

    <!-- Branch A: Alpha (Distance) -->
    <g transform="translate(12, 78)">
      <rect width="180" height="66" class="inner-panel" stroke="#38bdf8" stroke-width="0.8" />
      <text x="10" y="18" class="title" style="font-size: 11px; fill: #38bdf8;">Alpha: Distance Field</text>
      <text x="10" y="34" class="sub">Drives <tspan class="code">Conform to SDF</tspan></text>
      <text x="10" y="50" class="sub">Particles stick &amp; slide on shell</text>
    </g>

    <!-- Branch B: RGB (Color) -->
    <g transform="translate(12, 154)">
      <rect width="180" height="66" class="inner-panel" stroke="#f43f5e" stroke-width="0.8" />
      <text x="10" y="18" class="title" style="font-size: 11px; fill: #fb7185;">RGB: Decoupled Color</text>
      <text x="10" y="34" class="sub">Sets <tspan class="code">Set Color</tspan> attribute</text>
      <text x="10" y="50" class="sub">Vivid per-primitive tint</text>
    </g>
  </g>

  <!-- CONNECTORS -->
  <path d="M 212 204 L 236 204" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)" />
  <path d="M 436 204 L 460 204" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrCyan)" />
  <path d="M 660 204 L 684 204" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrPurple)" />

</svg>
