<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <style>
    .diagram-bg { fill: url(#bgGrad); stroke: #30363d; stroke-width: 1.5; rx: 12px; }
    .card-panel { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
    .inner-panel { fill: #0d1117; stroke: #21262d; stroke-width: 1; rx: 6px; }
    .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 600; fill: #f0f6fc; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; line-height: 1.4; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #58a6ff; }
  </style>

  <!-- Background -->
  <rect width="920" height="380" class="diagram-bg" />

  <!-- Header -->
  <g transform="translate(32, 34)">
    <text x="0" y="0" class="kicker" fill="#c084fc">SEAMLESS IMPLICIT SURFACE SHADING</text>
    <text x="0" y="22" class="title" style="font-size: 18px; font-weight: 700;">Object-Space Triplanar Projection &amp; Surface Normal Normalization</text>
  </g>

  <!-- STEP 1: SURFACE POINT & NORMAL (X: 32, W: 190) -->
  <g transform="translate(32, 86)">
    <rect width="190" height="260" class="card-panel" />
    <rect x="0" y="0" width="4" height="260" fill="#38bdf8" rx="2" />

    <text x="16" y="24" class="kicker" fill="#38bdf8">STEP 01 • INPUTS</text>
    <text x="16" y="44" class="title">Point &amp; Normal</text>
    <text x="16" y="62" class="sub">No UV coordinates required</text>

    <g transform="translate(12, 78)">
      <rect width="166" height="166" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 11.5px; fill: #38bdf8;">Object Coordinates</text>
      <text x="12" y="38" class="code">p = float3(x, y, z)</text>
      <text x="12" y="60" class="title" style="font-size: 11.5px; fill: #34d399;">Numerical Gradient</text>
      <text x="12" y="78" class="code">N = normalize(∇d)</text>
      <text x="12" y="98" class="sub">Central differences</text>
      <text x="12" y="114" class="sub">sampling across 6 voxels</text>
      <text x="12" y="142" class="code" style="fill:#fbbf24;">Zero UV seam pinching</text>
    </g>
  </g>

  <!-- STEP 2: TRI-AXIAL SAMPLING (X: 246, W: 210) -->
  <g transform="translate(246, 86)">
    <rect width="210" height="260" class="card-panel" />
    <rect x="0" y="0" width="4" height="260" fill="#f59e0b" rx="2" />

    <text x="16" y="24" class="kicker" fill="#f59e0b">STEP 02 • SAMPLING</text>
    <text x="16" y="44" class="title">Orthogonal Planes</text>
    <text x="16" y="62" class="sub">Three 2D texture queries</text>

    <g transform="translate(12, 78)">
      <rect width="186" height="166" class="inner-panel" stroke="#f59e0b" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 11.5px; fill: #fbbf24;">X-Plane (YZ coords)</text>
      <text x="12" y="36" class="code">colX = tex2D(T, p.yz * scale)</text>
      
      <text x="12" y="68" class="title" style="font-size: 11.5px; fill: #fbbf24;">Y-Plane (XZ coords)</text>
      <text x="12" y="84" class="code">colY = tex2D(T, p.xz * scale)</text>
      
      <text x="12" y="116" class="title" style="font-size: 11.5px; fill: #fbbf24;">Z-Plane (XY coords)</text>
      <text x="12" y="132" class="code">colZ = tex2D(T, p.xy * scale)</text>
    </g>
  </g>

  <!-- STEP 3: EXPONENTIAL BLENDING (X: 480, W: 210) -->
  <g transform="translate(480, 86)">
    <rect width="210" height="260" class="card-panel" stroke="#c084fc" stroke-dasharray="4 2" />
    <rect x="0" y="0" width="4" height="260" fill="#c084fc" rx="2" />

    <text x="16" y="24" class="kicker" fill="#c084fc">STEP 03 • WEIGHTING</text>
    <text x="16" y="44" class="title">Normal Weights</text>
    <text x="16" y="62" class="sub">Exponential threshold filter</text>

    <g transform="translate(12, 78)">
      <rect width="186" height="166" class="inner-panel" stroke="#c084fc" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 11.5px; fill: #c084fc;">Mikkelsen Weighting</text>
      <text x="12" y="40" class="code">w = max(0, |N| - 0.2)⁴</text>
      <text x="12" y="62" class="sub">Power of 4 prevents</text>
      <text x="12" y="78" class="sub">washed-out diagonals</text>
      
      <text x="12" y="104" class="code" style="fill:#34d399;">w_norm = w / (wx+wy+wz)</text>
      <text x="12" y="126" class="sub">Unit partition of unity</text>
      <text x="12" y="146" class="sub" style="font-size:9.5px; fill:#38bdf8;">Hardware ALU friendly</text>
    </g>
  </g>

  <!-- STEP 4: FINAL ACCUMULATION (X: 714, W: 174) -->
  <g transform="translate(714, 86)">
    <rect width="174" height="260" class="card-panel" />
    <rect x="0" y="0" width="4" height="260" fill="#34d399" rx="2" />

    <text x="16" y="24" class="kicker" fill="#34d399">STEP 04 • RESULT</text>
    <text x="16" y="44" class="title">Seamless Color</text>
    <text x="16" y="62" class="sub">Shading evaluation</text>

    <g transform="translate(12, 78)">
      <rect width="150" height="166" class="inner-panel" stroke="#34d399" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 11px; fill: #34d399;">Final Accumulation</text>
      <text x="12" y="38" class="code" style="font-size:9.5px;">colX * w.x +</text>
      <text x="12" y="52" class="code" style="font-size:9.5px;">colY * w.y +</text>
      <text x="12" y="66" class="code" style="font-size:9.5px;">colZ * w.z</text>
      
      <line x1="10" y1="80" x2="140" y2="80" stroke="#21262d" stroke-width="1" />
      
      <text x="12" y="98" class="sub" style="fill:#f0f6fc; font-weight:600;">Outputs to:</text>
      <text x="12" y="114" class="sub">• MatCap Lit Shading</text>
      <text x="12" y="130" class="sub">• Cellular Membrane</text>
      <text x="12" y="146" class="sub">• Emission Glow</text>
    </g>
  </g>

  <!-- CONNECTORS -->
  <path d="M 222 216 L 246 216" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)" />
  <path d="M 456 216 L 480 216" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)" />
  <path d="M 690 216 L 714 216" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrPurple)" />

</svg>
