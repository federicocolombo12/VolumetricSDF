<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Sleek Arrow Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <style>
    .diagram-bg { fill: url(#bgGrad); stroke: #30363d; stroke-width: 1.5; rx: 12px; }
    .card-panel { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
    .inner-panel { fill: #0d1117; stroke: #21262d; stroke-width: 1; rx: 6px; }
    .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; line-height: 1.4; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #58a6ff; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="500" class="diagram-bg" />

  <!-- Diagram Header -->
  <g transform="translate(32, 34)">
    <text x="0" y="0" class="kicker" fill="#c084fc">GPU VOXELIZATION &amp; PROCEDURAL CSG PIPELINE</text>
    <text x="0" y="22" class="title" style="font-size: 18px; font-weight: 700;">VolumetricSDF High-Performance Compute Shader &amp; Particle Architecture</text>
  </g>

  <!-- STAGE 1: CSG MODELING HIERARCHY (X: 32, W: 215) -->
  <g transform="translate(32, 90)">
    <rect width="215" height="376" class="card-panel" />
    <rect x="0" y="0" width="4" height="376" fill="#c084fc" rx="2" />

    <text x="16" y="24" class="kicker" fill="#c084fc">STAGE 01 • SCENE GRAPH</text>
    <text x="16" y="44" class="title">CSG Hierarchy</text>
    <text x="16" y="62" class="sub">Implicit mathematical geometry</text>

    <!-- Primitive Card -->
    <g transform="translate(12, 76)">
      <rect width="191" height="66" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #c084fc;">SdfNode Primitives</text>
      <text x="12" y="36" class="sub">Sphere, Box, Torus, Capsule,</text>
      <text x="12" y="52" class="sub">Cylinder, Plane, Gyroid Surface</text>
    </g>

    <!-- Boolean Blend Card -->
    <g transform="translate(12, 152)">
      <rect width="191" height="78" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #34d399;">Smooth CSG Booleans</text>
      <text x="12" y="38" class="code" style="font-size: 10px;">smin(d1, d2, k)  [Union]</text>
      <text x="12" y="54" class="code" style="font-size: 10px;">smax(d1, -d2, k) [Subtract]</text>
      <text x="12" y="70" class="code" style="font-size: 10px;">smax(d1, d2, k)  [Intersect]</text>
    </g>

    <!-- Group Controller Card -->
    <g transform="translate(12, 240)">
      <rect width="191" height="118" class="inner-panel" stroke="#c084fc" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #c084fc;">SdfGroupController</text>
      <text x="12" y="38" class="sub">Dynamic global parameters:</text>
      <text x="12" y="54" class="code">• globalBlendSoftness</text>
      <text x="12" y="70" class="code">• currentPulse (Systole)</text>
      <text x="12" y="86" class="code">• morphFactor (Bouba-Kiki)</text>
      <text x="12" y="104" class="sub" style="font-size: 9.5px; fill:#34d399;">Modulated via PulseEngine</text>
    </g>
  </g>

  <!-- STAGE 2: BOUNDED MODIFIERS (X: 263, W: 200) -->
  <g transform="translate(263, 90)">
    <rect width="200" height="376" class="card-panel" />
    <rect x="0" y="0" width="4" height="376" fill="#38bdf8" rx="2" />

    <text x="16" y="24" class="kicker" fill="#38bdf8">STAGE 02 • FORCE FIELDS</text>
    <text x="16" y="44" class="title">Modifier Volumes</text>
    <text x="16" y="62" class="sub">Locally bounded domain warps</text>

    <!-- Modifier Types -->
    <g transform="translate(12, 76)">
      <rect width="176" height="136" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #38bdf8;">Bounded Modifiers</text>
      <text x="12" y="38" class="sub">• <tspan style="fill:#f0f6fc; font-weight:600;">Twist / Torsion</tspan></text>
      <text x="12" y="56" class="sub">• <tspan style="fill:#f0f6fc; font-weight:600;">Bend / Curve</tspan></text>
      <text x="12" y="74" class="sub">• <tspan style="fill:#f0f6fc; font-weight:600;">Taper / Dilate</tspan></text>
      <text x="12" y="92" class="sub">• <tspan style="fill:#f0f6fc; font-weight:600;">3D Simplex Noise</tspan></text>
      <text x="12" y="110" class="sub">• <tspan style="fill:#f0f6fc; font-weight:600;">Radial Ripple Pulse</tspan></text>
      <text x="12" y="126" class="code" style="font-size:9.5px;">Smooth Hermite Falloff</text>
    </g>

    <!-- Optimization Note -->
    <g transform="translate(12, 222)">
      <rect width="176" height="136" class="inner-panel" stroke="#38bdf8" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #38bdf8;">Spatial Acceleration</text>
      <text x="12" y="38" class="sub">AABB Bounding Box Cull:</text>
      <text x="12" y="54" class="sub">Warp transforms execute</text>
      <text x="12" y="68" class="sub"><tspan style="color:#34d399; font-weight:600;">only inside</tspan> the local box.</text>
      <text x="12" y="92" class="code" style="font-size: 9.5px;">Zero cost outside bounds</text>
      <text x="12" y="112" class="sub" style="font-size: 9.5px; fill:#8b949e;">GPU early branch skip</text>
    </g>
  </g>

  <!-- STAGE 3: GPU COMPUTE VOXELIZER (X: 479, W: 220) -->
  <g transform="translate(479, 90)">
    <rect width="220" height="376" class="card-panel" stroke="#ec4899" stroke-dasharray="4 2" />
    <rect x="0" y="0" width="4" height="376" fill="#ec4899" rx="2" />

    <text x="16" y="24" class="kicker" fill="#ec4899">STAGE 03 • COMPUTE</text>
    <text x="16" y="44" class="title">SdfVolumeVoxelizer</text>
    <text x="16" y="62" class="sub">Asynchronous GPU kernel</text>

    <!-- Grid Resolution -->
    <g transform="translate(12, 76)">
      <rect width="196" height="84" class="inner-panel" stroke="#ec4899" stroke-width="0.8" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #ec4899;">Compute Threadgroups</text>
      <text x="12" y="38" class="sub">128³ Resolution (2,097,152 voxels)</text>
      <text x="12" y="54" class="code">numthreads(8, 8, 8)</text>
      <text x="12" y="70" class="sub" style="fill:#34d399; font-size:10px;">Dispatch: 16 × 16 × 16 groups</text>
    </g>

    <!-- Dual Texture Output -->
    <g transform="translate(12, 170)">
      <rect width="196" height="188" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #f0f6fc;">Dual 3D RenderTextures</text>
      
      <text x="12" y="40" class="kicker" fill="#38bdf8" style="font-size:9px;">PASS 1: DISTANCE (R16_SFloat)</text>
      <text x="12" y="54" class="sub">Scalar metric distance <tspan class="code">d(x,y,z)</tspan></text>
      <text x="12" y="68" class="sub">Zero overhead pure evaluation</text>

      <line x1="12" y1="80" x2="184" y2="80" stroke="#21262d" stroke-width="1" />

      <text x="12" y="98" class="kicker" fill="#f43f5e" style="font-size:9px;">PASS 2: DECOUPLED COLOR</text>
      <text x="12" y="112" class="sub">Isosurface-only color &amp; normal</text>
      <text x="12" y="126" class="code">RGBA32_SFloat</text>
      <text x="12" y="142" class="sub">Evaluated <tspan style="color:#fbbf24; font-weight:600;">only</tspan> when |d| &lt; 2 voxels</text>
      <text x="12" y="162" class="sub" style="font-size:9.5px; fill:#34d399;">Saves 85% compute overhead</text>
    </g>
  </g>

  <!-- STAGE 4: OUTPUT RENDERERS (X: 715, W: 213) -->
  <g transform="translate(715, 90)">
    <rect width="213" height="376" class="card-panel" />
    <rect x="0" y="0" width="4" height="376" fill="#34d399" rx="2" />

    <text x="16" y="24" class="kicker" fill="#34d399">STAGE 04 • TARGETS</text>
    <text x="16" y="44" class="title">Dual Output Engine</text>
    <text x="16" y="62" class="sub">VFX particles &amp; raymarching</text>

    <!-- Target A: VFX Graph -->
    <g transform="translate(12, 76)">
      <rect width="189" height="136" class="inner-panel" stroke="#ec4899" stroke-width="1" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #ec4899;">Unity VFX Graph</text>
      <text x="12" y="38" class="sub">• 3D Texture Vector Field</text>
      <text x="12" y="54" class="sub">• Particle Surface Adhesion</text>
      <text x="12" y="70" class="sub">• Dynamic Collision &amp; Conform</text>
      <text x="12" y="88" class="code" style="font-size: 10px;">Sample SDF 3D Texture</text>
      <text x="12" y="112" class="sub" style="font-size: 9.5px; fill:#34d399;">Over 250,000 live particles</text>
      <text x="12" y="126" class="sub" style="font-size: 9.5px; fill:#8b949e;">at 90 FPS on Meta Quest 3</text>
    </g>

    <!-- Target B: Raymarching Shader -->
    <g transform="translate(12, 222)">
      <rect width="189" height="136" class="inner-panel" stroke="#34d399" stroke-width="1" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #34d399;">Raymarching Shader</text>
      <text x="12" y="38" class="sub">• Sphere-tracing camera rays</text>
      <text x="12" y="54" class="sub">• Triplanar MatCap shading</text>
      <text x="12" y="70" class="sub">• Decoupled fill-rate scaling</text>
      <text x="12" y="88" class="code" style="font-size: 10px;">Zero Vertex Geometry</text>
      <text x="12" y="112" class="sub" style="font-size: 9.5px; fill:#34d399;">Pixel-perfect curvature</text>
      <text x="12" y="126" class="sub" style="font-size: 9.5px; fill:#8b949e;">Organic cellular sheen</text>
    </g>
  </g>

  <!-- CONNECTOR PIPELINES -->
  <path d="M 247 278 L 263 278" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrPurple)" />
  <path d="M 463 278 L 479 278" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)" />
  <path d="M 699 278 L 715 278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)" />

</svg>
